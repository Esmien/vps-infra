name: uptime

# Внешний монитор: проверяет публичные домены СНАРУЖИ (с раннеров GitHub),
# потому что внутренний мониторинг живёт на том же хосте и умирает вместе с ним.
# Тревога: Telegram (secret TG_BOT_TOKEN) в топик "VPS" группы + письмо GitHub о падении воркфлоу.
#
# Про Cloudflare: ai.esmien.ru идёт через CF с бот-защитой, и раннер GitHub для неё —
# бот: ответ 403 означает «CF жив и фильтрует», а не «сервер упал». Поэтому 403 для
# этого адреса считается нормой, а живость origin проверяется по DNS-only адресу
# llm.esmien.ru напрямую (nginx + LiteLLM + WebUI).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      extra_url:
        description: "Доп. URL для проверки (заведомо битый = drill алерта)"
        required: false
        default: ""

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public endpoints
        id: probe
        run: |
          set -uo pipefail
          fail=""
          # $1 = url, $2 = допустимые коды через запятую
          probe() {
            url="$1"; ok="$2"
            for i in 1 2 3; do
              code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "$url" 2>/dev/null || echo 000)
              case ",$ok," in
                *",$code,"*) echo "ok $url -> $code"; return 0 ;;
              esac
              sleep 15
            done
            echo "FAIL $url -> $code"
            fail="$fail $url($code)"
            return 1
          }
          rc=0
          # origin напрямую (CF DNS-only): nginx + LiteLLM
          probe https://llm.esmien.ru/health/liveliness 200 || rc=1
          # origin напрямую: WebUI (nginx -> 127.0.0.1:8080/health)
          probe https://llm.esmien.ru/webui-health 200 || rc=1
          # через Cloudflare: 200 = всё ок, 403 = CF жив и режет бота-раннера
          probe https://ai.esmien.ru/ 200,403 || rc=1
          if [ -n "${{ inputs.extra_url }}" ]; then
            probe "${{ inputs.extra_url }}" 200 || rc=1
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Alert Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ]; then echo "no token"; exit 0; fi
          prefix=""
          if [ -n "${{ inputs.extra_url }}" ]; then prefix="[ТЕСТ] "; fi
          text="${prefix}🔴 VPS не отвечает
          Домен: ${{ steps.probe.outputs.fail }}
          Время: $(date -u +%Y-%m-%dT%H:%MZ)"
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id=-1004410657647 \
            -d message_thread_id=2 \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${text}"
