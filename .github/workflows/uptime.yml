name: uptime

# Внешний монитор: проверяет публичные домены СНАРУЖИ (с раннеров GitHub),
# потому что внутренний мониторинг живёт на том же хосте и умирает вместе с ним.
# Тревога: Telegram (secret TG_BOT_TOKEN) + письмо GitHub о падении воркфлоу.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      extra_url:
        description: "Доп. URL для проверки (заведомо битый = drill алерта)"
        required: false
        default: ""

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public endpoints
        id: probe
        run: |
          set -uo pipefail
          fail=""
          probe() {
            url="$1"
            for i in 1 2 3; do
              code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "$url" 2>/dev/null || echo 000)
              if [ "$code" = "200" ]; then
                echo "ok $url -> $code"
                return 0
              fi
              sleep 15
            done
            echo "FAIL $url -> $code"
            fail="$fail $url($code)"
            return 1
          }
          rc=0
          probe https://ai.esmien.qd.je/ || rc=1
          probe https://llm.esmien.qd.je/ || rc=1
          if [ -n "${{ inputs.extra_url }}" ]; then
            probe "${{ inputs.extra_url }}" || rc=1
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Alert Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ]; then echo "no token"; exit 0; fi
          prefix=""
          if [ -n "${{ inputs.extra_url }}" ]; then prefix="[ТЕСТ] "; fi
          text="${prefix}🔴 VPS не отвечает%0AДомен:%20${{ steps.probe.outputs.fail }}%0AВремя:%20$(date -u +%Y-%m-%dT%H:%MZ)"
          curl -sS -m 20 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id=214062001 -d disable_web_page_preview=true \
            --data-urlencode "text=$(printf '%b' "$text")"
