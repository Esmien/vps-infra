# ~/.litellm.config.yaml

# Конфигурационный файл для ротации ключей с лимитами

# Запуск прокси (запускается на http://localhost:4000):
# 1. tmux new -s litellm
# 2. litellm --config ~/.litellm.config.yaml
# 3. Ctrl+B -> D

litellm_settings:
  drop_params: true

general_settings:
  # Вход в админку больше не идёт по статической паре из .env (UI_USERNAME/UI_PASSWORD)
  # и не принимает мастер-ключ на форме логина. Админ — обычный юзер в БД со своим
  # паролем (black.walf16@gmail.com / alias esmien). Откат: убрать флаг + restart.
  # Мастер-ключ по-прежнему работает как Bearer для API — это и есть break-glass.
  disable_env_credential_login: true
  forward_client_headers_to_llm_api: true
  # Кто стоит перед LiteLLM: только локальный nginx (127.0.0.1:4000 -> docker-proxy).
  # Нужно, чтобы login-throttle считал лимиты по РЕАЛЬНОМУ IP клиента из X-Forwarded-For,
  # а не по адресу прокси. Без этого все попытки входа из интернета идут одним ведром.
  # Намеренно НЕ 172.18.0.0/16: иначе любой контейнер stack-net мог бы подделать XFF.
  trusted_proxy_ranges:
    - "127.0.0.1/32"
    - "172.18.0.1/32"

# Настрйоки ротации
router_settings:
  allowed_fails: 2        # Исключить ключ после первой ошибки 429
  cooldown_time: 60      # Заморозка ключа на 1 минуту
  routing_strategy: simple-shuffle # ротирует ключи активной модели, пока не исчерпаются, потом падает на fallback-модель
  # Argon: единственный маршрут — OpenCode (бесплатный прокси убран 2026-11-06)
  # Terra: порядок задаётся внутри группы openai/gpt-6.1-terra
  # (order 1 siwc-мост → 2 OpenRouter → 3 серая chatgpt/), поэтому в fallbacks
  # её нет — иначе приоритеты дублируются и группа-фолбэк маскирует порядок ног.
  fallbacks:
    - google/gemini-4-argon: ["opencode/gemini-4-argon"]
    - openai/gpt-6-luna: ["opencode/gpt-6-luna"]

