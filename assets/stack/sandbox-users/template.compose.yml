# Пользовательский терминал песочницы. Один файл = один пользователь.
# Provisioner подставляет: SB_SLUG, SB_KEY, SB_DIR, SB_MEM, SB_MEMSWAP, SB_CPUS.
# Запуск: docker compose -p sb-<slug> -f template.compose.yml up -d
# Общего слоя с пакетами нет: всё нужное под задачу пользователь ставит себе сам
# (~/.local, ~/bin). Общий слой — только образ.
services:
  terminal:
    # Пин по дайджесту: :latest — rolling-тег, тот же тег со временем указывает на другой код.
    image: ghcr.io/open-webui/open-terminal@sha256:81a5394b3cd4ae32adb600f2135f09ee124de37f26b0a780e2f5692472c0fc5c
    container_name: ot-u-${SB_SLUG}
    restart: always
    user: "1000:1000"
    command: ["run", "--cwd", "/home/user/workspace"]
    mem_limit: ${SB_MEM:-1536m}
    # Своп контейнеру разрешён: 1.5 ГБ памяти + 0.5 ГБ свопа.
    # memswap_limit == mem_limit означал бы «своп запрещён» — тогда пик сразу убивает контейнер.
    memswap_limit: ${SB_MEMSWAP:-2g}
    cpus: "${SB_CPUS:-1.0}"
    pids_limit: 256
    cap_drop: ["ALL"]
    # python3-ot несёт файловую capability cap_setgid — без неё exec падает с EPERM.
    cap_add: ["SETGID"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${SB_DIR}:/home/user/workspace
      - type: bind
        source: ${SB_DIR}/.agents
        target: /home/user/workspace/.agents
        read_only: true
        bind:
          create_host_path: false
    environment:
      OPEN_TERMINAL_API_KEY: ${SB_KEY}
      # HOME = рабочий каталог: pip --user кладёт пакеты в /home/user/workspace/.local,
      # они живут внутри квоты пользователя и защищены от LRU-чистки.
      HOME: /home/user/workspace
      # /tmp — tmpfs с noexec, PyInstaller-бутлоадеры распаковывают .so в TMPDIR.
      TMPDIR: /home/user/workspace/.tmp
      # Файловый браузер стартует в /home/user и показывает ровно одну папку — workspace.
      OPEN_TERMINAL_FILE_BROWSER_ROOT: /home/user
      PATH: /home/user/workspace/.local/bin:/home/user/workspace/bin:/usr/local/bin:/usr/bin:/bin
      # glibc malloc: те же настройки, что у рут-терминала. Без них при наплыве
      # параллельных запросов процесс нарезает вторичные арены по 64 МиБ и держит
      # их до перезапуска (RSS растёт на сотни МБ). Значения читаются загрузчиком
      # на старте процесса — правка требует пересоздания контейнера.
      MALLOC_ARENA_MAX: "2"
      PYTHONMALLOC: malloc
      MALLOC_TRIM_THRESHOLD_: "131072"
      MALLOC_MMAP_THRESHOLD_: "131072"
      # Рецепты для моделей. Open WebUI забирает этот текст (GET /system) и подставляет
      # в контекст любой модели, работающей с этим терминалом. Правится здесь, один раз.
      OPEN_TERMINAL_SYSTEM_PROMPT: |
        You have a personal Linux sandbox ({{os}} {{kernel}}, {{arch}}, python {{python_version}}).
        You work inside /home/user/workspace — that is your home and the only place you can write; TMPDIR is <work>/.tmp.

        You are NOT root and cannot become root: sudo, apt, apt-get install, systemctl and pip3 install (without --user) do not work here. Do not try them.

        Installing what a task needs — do it yourself, these work:
        - Python: `pip3 install --user <package>` — goes to ~/.local, already on PATH.
        - Node: `npm install --prefix ~/.local <package>`, binaries land in ~/.local/bin.
        - Standalone binaries: download into ~/bin, `chmod +x`.
        - A tool shipped as a system .deb: `curl -fsSLO <debian-pool-url>`, then `dpkg-deb -x file.deb ./pkg` and run `./pkg/usr/bin/<tool>`; no root needed.
        - Compilers are present: gcc, g++, make, cmake, git.
        - If a build fails with "cannot execute" / "Permission denied" on temp files, export TMPDIR=~/.tmp first: /tmp in this sandbox is mounted noexec and some toolchains try to run binaries from it.

        If a task truly requires a system-level package (daemon, kernel module, a global path), stop and say so: only the server owner can add it, and that needs rebuilding the image. Do not invent workarounds, do not modify anything outside your working directory.

        Generated images: save every picture you produce (matplotlib, PIL, charts, screenshots you create) into ~/generated_images/ — that is the folder the user looks in. Do not scatter images in the workspace root.
        Handing files to the user: give the absolute path and tell them to open it in the Files panel. Never write markdown links like [name](path) — there is no HTTP endpoint serving workspace files, so such a link just opens an empty chat.
        Disk: your workspace has a 2 GB budget. Binaries and package directories (~/.local, ~/bin) are excluded from cleanup; working files are deleted oldest-first when the budget is reached, so keep only what matters and clean build artifacts when done.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 4 http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
    networks:
      - stack-net

networks:
  stack-net:
    external: true
