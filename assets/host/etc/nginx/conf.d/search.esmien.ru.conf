# search.esmien.ru -> SearXNG (127.0.0.1:8081), только с API-ключом.
server {
    listen 80;
    listen [::]:80;
    server_name search.esmien.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    listen [::1]:9443 proxy_protocol ssl http2;
    server_name search.esmien.ru;

    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4M;
    access_log /var/log/nginx/search.access.log cfkomb;
    error_log  /var/log/nginx/search.error.log;

    # без ключа (заголовок X-API-Key или ?key=) — 401
    if ($search_key_ok = 0) { return 401; }

    limit_req zone=search_api burst=20 nodelay;
    limit_conn conn_per_ip_cf 30;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
