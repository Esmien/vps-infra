# ai.esmien.ru -> open-webui (127.0.0.1:8080)
# Домен идёт через Cloudflare (оранжевое облако), настоящий IP клиента считает
# map $client_ip из 01-cf-client-ip.conf: CF-Connecting-IP либо PROXY protocol.
server {
    listen 80;
    server_name ai.esmien.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name ai.esmien.ru;
    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log cfkomb;
    error_log  /var/log/nginx/error.log;

    # Иконки PWA и манифест: браузер запоминает их при установке и потом
    # показывает старую картинку. Отдаём no-cache, чтобы переустановка
    # подхватывала актуальный файл без ручной очистки кэша.
    location ~ ^/(manifest\.json|static/(logo\.png|favicon\.png|favicon-96x96\.png|favicon\.ico|favicon\.svg|apple-touch-icon\.png|web-app-manifest-.*\.png))$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Регистрация: жёсткий лимит на IP (3/мин) — отдельно от общего API-лимита.
    location = /api/v1/auths/signup {
        limit_req zone=webui_signup burst=2 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # anti-flood только на API: вход, чат, загрузки.
    # Статика (/assets, /_app, /static) не лимитируется — чтобы не ломать загрузку страницы.
    location /api/ {
        limit_req zone=webui_api_cf burst=120 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        limit_conn conn_per_ip_cf 30;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
