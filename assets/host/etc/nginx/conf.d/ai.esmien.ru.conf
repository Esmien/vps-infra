# ai.esmien.ru -> open-webui (127.0.0.1:8080)
# Домен идёт через Cloudflare (оранжевое облако), настоящий IP клиента считает
# map $client_ip из 01-cf-client-ip.conf: CF-Connecting-IP либо PROXY protocol.
server {
    listen 80;
    server_name ai.esmien.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name ai.esmien.ru;
    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;

    # Только через Cloudflare: прямой заход на origin по 443 запрещён,
    # чтобы нельзя было обойти WAF/Bot Fight Mode, зная IP сервера.
    # ACME-путь исключён, чтобы HTTP-01 работал и напрямую.
    if ($deny_direct) {
        return 403;
    }

    access_log /var/log/nginx/access.log cfkomb;

    # Базовые security-заголовки. CSP намеренно нет: SPA Open WebUI живёт на
    # инлайн-стилях и динамических блобах, политику надо подбирать иначе
    # сломается UI; HSTS/anti-clickjacking/mime-sniffing закрывают дешёвую часть.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    error_log  /var/log/nginx/error.log;

    # Иконки PWA и манифест: браузер запоминает их при установке и потом
    # показывает старую картинку. Отдаём no-cache, чтобы переустановка
    # подхватывала актуальный файл без ручной очистки кэша.
    location ~ ^/(manifest\.json|static/(logo\.png|favicon\.png|favicon-96x96\.png|favicon\.ico|favicon\.svg|apple-touch-icon\.png|web-app-manifest-.*\.png))$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Turnstile-гейт: публичная конфигурация для JS и внутренняя проверка токена.
    location = /_turnstile/config {
        proxy_pass http://127.0.0.1:8099/config;
        proxy_set_header Host $host;
    }

    location = /_turnstile/verify {
        internal;
        proxy_pass http://127.0.0.1:8099/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Turnstile-Token $http_cf_turnstile_response;
        proxy_set_header X-Client-IP $client_ip;
    }

    # Вход: отдельный лимит и бан-чек (капчи на логине нет — вместо неё
    # жёсткий лимит + fail2ban-джейл owui-auth).
    location = /api/v1/auths/signin {
        if ($owui_banned_ip) {
            return 403;
        }
        limit_req zone=webui_signin burst=3 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Регистрация: жёсткий лимит на IP (3/мин) — отдельно от общего API-лимита.
    location = /api/v1/auths/signup {
        # Регистрация проходит только с валидным токеном Turnstile.
        auth_request /_turnstile/verify;
        if ($owui_banned_ip) {
            return 403;
        }
        limit_req zone=webui_signup burst=2 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # anti-flood только на API: вход, чат, загрузки.
    # Статика (/assets, /_app, /static) не лимитируется — чтобы не ломать загрузку страницы.
    # Аватарки моделей: WebUI ставит только ETag, без Cache-Control, и браузер
    # перезапрашивает все ~124 картинки на каждый заход, вставая в очередь
    # единственного uvicorn-воркера. Кэшируем в браузере на час.
    location = /api/v1/models/model/profile/image {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "private, max-age=3600" always;
    }

    location /api/ {
        limit_req zone=webui_api_cf burst=240 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        limit_conn conn_per_ip_cf 60;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
