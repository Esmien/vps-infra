# Заглушка «панель LiteLLM» для публичных мест VPN-входа.
#
# Отдаёт статику из настоящей сборки панели (/var/www/llm-decoy/ui) — визуально
# неотличимо от рабочей панели, — но ни один запрос не уходит в рабочий LiteLLM
# (127.0.0.1:4000). Любой вход отбивается тем же 401 и тем же телом, что отдаёт
# настоящая панель на неверный пароль.
#
# Слушает только loopback: снаружи этот сервер доступен исключительно через
# vpn-вхосты и vision-fallback, которые сами ходят сюда.
server {
    listen 127.0.0.1:8092;
    server_name _;
    access_log off;
    server_tokens off;
    root /var/www/llm-decoy;

    # Естественный отказ авторизации — ровно то, что отдаёт рабочая панель.
    error_page 418 = @decoy401;
    location @decoy401 {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 401 '{"error":{"message":"Invalid credentials used to access UI. Check the password set for your user","type":"auth_error","param":"invalid_credentials","code":"401"}}';
    }

    location = / { return 302 /ui/; }

    # API панели: ни одного апстрима, сразу отказ авторизации.
    location ^~ /ui/api/ { return 418; }

    # Статика панели — те же файлы, что отдаёт рабочая сборка.
    location ^~ /ui/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        default_type text/html;
        try_files $uri $uri/index.html =404;
    }

    location ^~ /litellm-asset-prefix/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        try_files $uri =404;
        expires 7d;
    }

    location = /favicon.ico { try_files /ui/favicon.ico =404; }

    # /login, /sso, /logout и любой другой путь: отказ авторизации, без бэкенда.
    location / { return 418; }
}
