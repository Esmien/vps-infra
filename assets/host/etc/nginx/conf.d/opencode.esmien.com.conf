# opencode.esmien.com -> opencode web server (127.0.0.1:4096), VPN-only.
# Вне VPN: 403 -> @drop -> 444 (обрыв без ответа). Доступ только с VPN-egress 85.92.158.238.
map $http_upgrade $oc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name opencode.esmien.com;
    allow 85.92.158.238;
    allow 127.0.0.1;
    deny all;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name opencode.esmien.com;

    # Только через наш VPN: клиенты выходят через edge, снаружи — соединение рвётся.
    allow 85.92.158.238;
    allow 127.0.0.1;
    deny all;
    error_page 403 = @drop;
    location @drop { return 444; }

    ssl_certificate /etc/letsencrypt/live/opencode-esmien-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencode-esmien-com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Esmien opencode";
    auth_basic_user_file /etc/nginx/vpn-stats.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/opencode.access.log;
    error_log  /var/log/nginx/opencode.error.log;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oc_connection_upgrade;

        # SSE/стриминг агента: без буферизации и с длинным таймаутом
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
