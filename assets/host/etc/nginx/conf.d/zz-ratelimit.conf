# Rate limiting (2026-10-31) — защита от L7-флуда
# llm: публичный API LiteLLM, ai: /api/ Open WebUI (вход + чат)
limit_req_zone $binary_remote_addr zone=llm_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=webui_api:10m rate=8r/s;
# /v1/models — самый долбимый путь (боты-сканеры), отдельный жёсткий лимит
limit_req_zone $binary_remote_addr zone=llm_models:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
