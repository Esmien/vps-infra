# Rate limiting — защита от L7-флуда.
# llm: публичный API LiteLLM, ai: /api/ Open WebUI (вход + чат).
#
# Ключ — РЕАЛЬНЫЙ IP клиента. На edge vhost `llm.esmien.ru` слушает
# 127.0.0.1:9443 proxy_protocol и включает real_ip_header proxy_protocol.
# Без этого $binary_remote_addr у ВСЕХ клиентов был 127.0.0.1, лимиты считались
# на весь сервер, и собственный WebUI получал 429 на /v1/models.
#
# Доверенный хост — WebUI на RU. У него 8 подключений к одному URL, то есть 8
# запросов /v1/models на каждое обновление списка моделей. Под общим лимитом
# 1 r/s это гарантированные 429, а WebUI выбрасывает модели подключения,
# которое не ответило. Пустой ключ в limit_req_zone/limit_conn_zone означает
# «запрос не учитывается», то есть лимит к нему не применяется.
geo $trusted_client {
    default 0;
    217.197.114.197/32 1;
}

map $trusted_client $limit_key {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone  $limit_key zone=llm_api:10m    rate=10r/s;
limit_req_zone  $limit_key zone=webui_api:10m  rate=8r/s;
# /v1/models — самый долбимый путь (боты-сканеры), отдельный жёсткий лимит
limit_req_zone  $limit_key zone=llm_models:10m rate=2r/s;
limit_conn_zone $limit_key zone=conn_per_ip:10m;
