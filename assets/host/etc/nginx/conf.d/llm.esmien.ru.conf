# llm.esmien.ru -> litellm (127.0.0.1:4000)
server {
    listen 80;
    server_name llm.esmien.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name llm.esmien.ru;
    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;
    access_log /var/log/nginx/llm.access.log;

    # anti-flood: 10 r/s на IP, всплеск 40, сверх — 429
    limit_req zone=llm_api burst=40 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn conn_per_ip 20;

    # сканеры долбят список моделей без ключа: 1 r/s на IP, сверх — 429
    location = /v1/models {
        limit_req zone=llm_models burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # статика админки: имена файлов хэшированные (content-hash) -> кэш на год.
    # Без этого каждый визит заново тащил ~3 МБ JS.
    location ^~ /ui/_next/static/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
