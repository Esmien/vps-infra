# llm.esmien.ru -> litellm (127.0.0.1:4000)
#
# Вариант для edge-хоста разделённого стека: сайт слушает только loopback и
# получает трафик из stream-SNI (443 -> 127.0.0.1:9443), поэтому блока на :80
# здесь нет — порт 80 занят stream-входом VPN, а сертификаты выдаются через
# Cloudflare DNS-01.
# NB: temporarily allow-all — tighten to VPN edge ranges after the tunnel is verified.
server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name llm.esmien.ru;

    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100M;
    access_log /var/log/nginx/llm.access.log;

    # Stream-вход (127.0.0.1:9443) передаёт PROXY-заголовок. Без этих строк
    # $remote_addr у всех клиентов = 127.0.0.1, и limit_req/limit_conn считаются
    # глобально на сервер, а не на IP (именно так WebUI ловил 429 на /v1/models).
    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;

    # anti-flood: 10 r/s на IP, всплеск 40, сверх — 429.
    limit_req zone=llm_api burst=40 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    # 20 не хватало: восемь человек со стримингом держат соединения десятками
    # секунд, и легитимные запросы получали 503.
    limit_conn conn_per_ip 60;

    # сканеры долбят список моделей без ключа: 2 r/s на IP, сверх — 429.
    # WebUI исключён из лимита по IP в zz-ratelimit.conf (у него 8 подключений
    # к одному URL, то есть 8 запросов на каждое обновление списка).
    location = /v1/models {
        limit_req zone=llm_models burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # внешний монитор GitHub Actions: проверка, что LiteLLM жив, без прохода через Cloudflare.
    location = /webui-health {
        allow all;
        proxy_pass http://127.0.0.1:4000/health/liveliness;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location ^~ /ui/_next/static/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
