# Настоящий IP клиента для доменов за Cloudflare.
# realip-модуль в этой конфигурации (proxy_protocol от stream-фронта + CF сверху)
# не даёт верного $remote_addr, поэтому считаем адрес сами:
#   - есть CF-Connecting-IP  -> трафик пришёл через Cloudflare, берём его;
#   - нет                    -> прямой трафик, берём адрес из PROXY protocol.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $proxy_protocol_addr;
}

# Лимиты, ключованные по настоящему IP (не по IP edge-сервера Cloudflare).
limit_req_zone  $client_ip zone=webui_api_cf:20m rate=10r/s;
limit_conn_zone $client_ip zone=conn_per_ip_cf:10m;
# регистрация: 3 попытки в минуту с одного IP
limit_req_zone  $client_ip zone=webui_signup:10m rate=3r/m;
# Вход: 10 попыток в минуту с одного IP (опечатки в пароле не мешают).
limit_req_zone  $client_ip zone=webui_signin:10m rate=10r/m;

log_format cfkomb '$client_ip [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ua="$http_user_agent" cf=$http_cf_ray';

# Только-через-Cloudflare: 1 = запрос пришёл через CF, 0 = напрямую на origin.
map $http_cf_connecting_ip $is_via_cf {
    default 1;
    ""      0;
}
# Путь ACME не гейтим никогда — чтобы HTTP-01 мог пройти и напрямую.
map $uri $is_acme_path {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}
# nginx не склеивает две переменные в одном if-условии, поэтому решение
# считается одним map-ом: 1 = пускать нельзя (не через CF и не ACME).
map "$is_via_cf:$is_acme_path" $deny_direct {
    default 0;
    "0:0"   1;
}

# Баны fail2ban (jail owui-auth): файл на каждый IP, содержимое "<ip> 1;".
map $client_ip $owui_banned_ip {
    default 0;
    include /etc/nginx/owui-blocks/*.conf;
}
