# app.esmien.ru -> 301 на ai.esmien.ru
# Оба имени смотрели в один и тот же open-webui (127.0.0.1:8080), но это давало
# две точки входа и две разные cookie-сессии (cookie привязана к hostname).
# Оставлен один публичный адрес: ai.esmien.ru. Здесь только редирект —
# ни лимитов, ни проксирования; защита живёт в ai.esmien.ru.conf.
server {
    listen 80;
    server_name app.esmien.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ai.esmien.ru$request_uri; }
}

server {
    listen 127.0.0.1:9443 proxy_protocol ssl http2;
    server_name app.esmien.ru;
    ssl_certificate /etc/letsencrypt/live/esmien-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esmien-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Путь и query сохраняем: закладки на конкретный чат не ломаются.
    return 301 https://ai.esmien.ru$request_uri;
}
