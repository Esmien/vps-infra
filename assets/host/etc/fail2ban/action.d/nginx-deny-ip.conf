[Definition]

# Бан на уровне nginx: iptables бесполезен, потому что TCP-соединения
# приходят от edge-серверов Cloudflare, а не от клиента. Поэтому fail2ban
# пишет файл с IP в /etc/nginx/owui-blocks/, map $owui_banned_ip в
# 01-cf-client-ip.conf подхватывает его, и auth-эндпоинты отвечают 403.

actionstart =
actionstop =
actioncheck =

actionban = printf '%%s 1;\n' '<ip>' > /etc/nginx/owui-blocks/<ip>.conf && nginx -t -q && systemctl reload nginx
actionunban = rm -f /etc/nginx/owui-blocks/<ip>.conf && nginx -t -q && systemctl reload nginx

[Init]
