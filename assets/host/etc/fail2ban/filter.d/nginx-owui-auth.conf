[Definition]

# Ловим неудачные попытки входа/регистрации в Open WebUI.
# Формат access.log — наш cfkomb: "<реальный IP> [дата] "запрос" статус ...",
# поэтому failregex начинается с <HOST> и сразу за ним скобка.

failregex = ^<HOST> \[[^\]]*\] "POST /api/v1/auths/(signin|signup) HTTP/[0-9.]+" (401|403) 
            ^<HOST> \[[^\]]*\] "POST /api/v1/auths/(signin|signup) HTTP/[0-9.]+" 429 

ignoreregex =

