server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name ai.esmien.qd.je;

    ssl_certificate /etc/letsencrypt/live/ai.esmien.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.esmien.qd.je/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/vpn-8443-ai.log;

    location = / { default_type text/plain; return 200 "ok\n"; }
    location /ws {
        proxy_pass http://127.0.0.1:10081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /general {
        proxy_pass http://127.0.0.1:10082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /france {
        proxy_pass http://127.0.0.1:10083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /test {
        proxy_pass http://127.0.0.1:10084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/sub/(?<esmien_sub_token>[A-Za-z0-9_-]+)/?$ {
        root /var/www/esmien-sub;
        try_files /$esmien_sub_token/$esmien_sub_file =404;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header profile-title "Esmien VPN";
        add_header profile-update-interval 12;
        add_header Content-Disposition "inline; filename=esmien-vpn";
    }
}

