server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name mon.esmien.qd.je;

    ssl_certificate /etc/letsencrypt/live/mon.esmien.qd.je/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mon.esmien.qd.je/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/vpn-8443.log;

    location /ws {
        proxy_pass http://127.0.0.1:10081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { default_type text/plain; return 200 "ok\n"; }
}
